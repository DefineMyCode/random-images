<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>随机图 · Picsum</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0b0d;
    --fg: #eef2f6;
    --dim: #9aa7b4;
    --glass: rgba(16, 20, 25, .58);
    --stroke: rgba(255, 255, 255, .14);
    --accent: #7dd3fc;
    --shadow: 0 24px 70px -30px rgba(0, 0, 0, .85);
    --veil: rgba(6, 8, 10, .55);
    --scrim: rgba(4, 6, 8, .94);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f0ea;
    --fg: #10151a;
    --dim: #5c6a76;
    --glass: rgba(255, 255, 255, .64);
    --stroke: rgba(10, 14, 18, .14);
    --accent: #0369a1;
    --shadow: 0 24px 60px -34px rgba(16, 24, 32, .5);
    --veil: rgba(242, 240, 234, .5);
    --scrim: rgba(8, 10, 12, .92);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
    display: flex;
    flex-direction: column;
    padding-top: max(20px, env(safe-area-inset-top, 0px));
    padding-bottom: max(22px, env(safe-area-inset-bottom, 0px));
    padding-left: max(clamp(14px, 4vw, 44px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(14px, 4vw, 44px), env(safe-area-inset-right, 0px));
    touch-action: manipulation;
  }
  #bg {
    position: fixed;
    inset: -60px;
    width: calc(100% + 120px);
    height: calc(100% + 120px);
    object-fit: cover;
    filter: blur(44px) saturate(1.25) brightness(.6);
    opacity: .5;
    z-index: -2;
    transition: opacity .4s ease;
  }
  #veil {
    position: fixed;
    inset: 0;
    background: var(--veil);
    z-index: -1;
    pointer-events: none;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding-bottom: 16px;
    flex: none;
  }
  .brand {
    font-size: 11.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand b { color: var(--fg); font-weight: 600; letter-spacing: .12em; }
  .brand span { color: var(--accent); }
  .actions { display: flex; gap: 8px; flex: none; }
  button {
    font: inherit;
    color: var(--fg);
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 11px;
    padding: 8px 13px;
    cursor: pointer;
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    transition: border-color .18s ease, color .18s ease, transform .12s ease, opacity .18s;
  }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .35; cursor: default; }
  @media (hover: hover) and (pointer: fine) {
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    footer a:hover { color: var(--accent); border-color: var(--accent); }
  }
  main { flex: 1; display: grid; place-items: center; min-height: 0; }
  .frame {
    position: relative;
    width: min(1120px, 100%);
    max-height: 100%;
    aspect-ratio: 8 / 5;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--stroke);
    background: var(--glass);
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  #photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .42s ease;
    background: #0d1013;
    cursor: zoom-in;
  }
  #photo.ready { opacity: 1; }
  #loader {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .25s ease;
    background: linear-gradient(100deg, transparent 18%, rgba(255,255,255,.13) 42%, transparent 66%);
    background-size: 220% 100%;
    animation: sheen 1.35s linear infinite;
    pointer-events: none;
  }
  #loader.show { opacity: 1; }
  @keyframes sheen {
    from { background-position: 130% 0; }
    to { background-position: -30% 0; }
  }
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    padding: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 19px;
    line-height: 1;
    z-index: 3;
  }
  .nav.prev { left: 14px; }
  .nav.next { right: 14px; }
  #error {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: none;
    max-width: min(90%, 520px);
    padding: 9px 14px;
    border-radius: 10px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    color: var(--fg);
    font-size: 13px;
    text-align: center;
    backdrop-filter: blur(14px);
    z-index: 4;
  }
  #error.show { display: block; }
  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 20px;
    padding: 14px 2px 0;
    font-size: 12.5px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  footer a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--stroke); }
  .hint kbd {
    font: inherit;
    font-size: 11.5px;
    padding: 1px 5px;
    border-radius: 5px;
    border: 1px solid var(--stroke);
    background: var(--glass);
  }
  .count { color: var(--fg); }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--scrim);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .lightbox[hidden] { display: none; }
  .lb-stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding-top: max(18px, env(safe-area-inset-top, 0px));
    padding-bottom: max(96px, calc(env(safe-area-inset-bottom, 0px) + 78px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    touch-action: none;
    cursor: grab;
  }
  .lb-stage.dragging { cursor: grabbing; }
  #lightboxImg {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 40px 90px -40px rgba(0,0,0,.9);
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    transform-origin: center center;
    transition: transform .14s ease-out;
    will-change: transform;
  }
  .lb-stage.dragging #lightboxImg { transition: none; }
  .lb-bar {
    position: absolute;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(760px, calc(100% - 32px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 12px 10px 16px;
    border-radius: 14px;
    border: 1px solid var(--stroke);
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    font-size: 12.5px;
    color: var(--dim);
    z-index: 2;
  }
  .lb-bar .lb-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-bar .lb-hint { color: var(--dim); opacity: .85; white-space: nowrap; }
  .lb-bar .lb-actions { display: flex; gap: 8px; align-items: center; flex: none; }
  .lb-zoom {
    min-width: 46px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .lb-bar button { padding: 7px 12px; font-size: 13px; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: max(26px, calc(env(safe-area-inset-bottom, 0px) + 8px));
    transform: translate(-50%, 14px);
    z-index: 60;
    max-width: min(90vw, 560px);
    padding: 10px 16px;
    border-radius: 11px;
    border: 1px solid var(--stroke);
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    color: var(--fg);
    font-size: 13px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    overflow-wrap: anywhere;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 620px) {
    .hint { display: none; }
    .nav { width: 44px; height: 44px; }
    .frame { aspect-ratio: 4 / 5; border-radius: 16px; }
    header { padding-bottom: 12px; }
    .actions button { padding: 8px 11px; font-size: 13px; }
    .brand { font-size: 10.5px; letter-spacing: .12em; }
    .node { display: none; }
    .lb-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 12px;
      width: calc(100% - 24px);
    }
    .lb-bar .lb-hint { display: none; }
    .lb-bar .lb-actions { justify-content: space-between; }
    .lb-bar .lb-meta { white-space: normal; }
    .lb-bar button { padding: 9px 14px; }
  }
  @media (max-width: 620px) and (orientation: landscape) {
    .frame { aspect-ratio: 16 / 9; }
  }
</style>
</head>
<body>
<img id="bg" alt="" aria-hidden="true">
<div id="veil"></div>

<header>
  <div class="brand"><b>Picsum</b> <span>·</span> 随机图 <span>·</span> 免费开放 API</div>
  <div class="actions">
    <button id="download" type="button" title="下载当前图片">下载</button>
    <button id="share" type="button" title="分享当前图片链接">分享</button>
    <button id="theme" type="button" title="切换深浅色">浅色</button>
  </div>
</header>

<main>
  <div class="frame">
    <img id="photo" alt="随机图片，点击全屏查看" decoding="async">
    <div id="loader"></div>
    <button class="nav prev" id="prev" type="button" aria-label="上一张">←</button>
    <button class="nav next" id="next" type="button" aria-label="下一张">→</button>
    <div id="error"></div>
  </div>
</main>

<footer>
  <div class="meta">
    <a id="credit" href="#" target="_blank" rel="noopener noreferrer">加载中…</a>
    <span id="dims"></span>
  </div>
  <div class="count"><span id="counter">–</span> · 已载入 <span id="poolSize">0</span> 张</div>
  <div class="hint">键盘 <kbd>←</kbd> <kbd>→</kbd> 切换 · 点图全屏</div>
  <div class="node">Node {{NODE}}</div>
</footer>

<div id="lightbox" class="lightbox" hidden>
  <div class="lb-stage" id="lbStage">
    <img id="lightboxImg" alt="全屏查看的随机图片" draggable="false">
  </div>
  <div class="lb-bar">
    <div class="lb-meta" id="lbMeta"></div>
    <div class="lb-hint">滚轮/双指缩放 · 拖拽平移 · 双击放大</div>
    <div class="lb-actions">
      <span class="lb-zoom" id="lbZoom">100%</span>
      <button id="lbDownload" type="button">下载</button>
      <button id="lbShare" type="button">分享</button>
      <button id="lbClose" type="button">关闭</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const BATCH = 12;
const MAX_ZOOM = 5;
const state = { pool: [], index: 0, busy: false, failures: 0, lightbox: false };
const zoom = { scale: 1, tx: 0, ty: 0 };
const measure = { availW: 0, availH: 0, baseW: 0, baseH: 0 };

const photo = document.getElementById("photo");
const frame = document.querySelector(".frame");
const bg = document.getElementById("bg");
const loader = document.getElementById("loader");
const errorBox = document.getElementById("error");
const credit = document.getElementById("credit");
const dims = document.getElementById("dims");
const counter = document.getElementById("counter");
const poolSize = document.getElementById("poolSize");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const lightbox = document.getElementById("lightbox");
const stage = document.getElementById("lbStage");
const lightboxImg = document.getElementById("lightboxImg");
const lbMeta = document.getElementById("lbMeta");
const lbZoom = document.getElementById("lbZoom");
const toastEl = document.getElementById("toast");

function imageUrl(pic, width, height) {
  return "https://picsum.photos/id/" + pic.id + "/" + Math.round(width) + "/" + Math.round(height);
}

function pixelRatio() {
  return Math.min(window.devicePixelRatio || 1, 2);
}

function mainImageUrl(pic) {
  const width = Math.max(1, frame.clientWidth || 1120);
  const height = Math.max(1, frame.clientHeight || Math.round(width * 0.625));
  const target = Math.max(480, Math.min(1600, Math.round(width * pixelRatio())));
  return imageUrl(pic, target, Math.max(280, Math.round(target * height / width)));
}

function lightboxImageUrl(pic) {
  const maxEdge = Math.max(720, Math.min(2200, Math.round(Math.max(window.innerWidth, window.innerHeight) * pixelRatio())));
  const ratio = pic.width && pic.height ? pic.height / pic.width : 0.75;
  if (ratio <= 1) {
    return imageUrl(pic, maxEdge, Math.max(360, Math.round(maxEdge * ratio)));
  }
  return imageUrl(pic, Math.max(360, Math.round(maxEdge / ratio)), maxEdge);
}

function normalize(list) {
  return list.map(function (pic) {
    return {
      id: pic.id,
      author: pic.author,
      width: pic.width,
      height: pic.height,
      link: pic.url || ("https://unsplash.com/photos/" + pic.id),
    };
  });
}

async function fetchBatch() {
  try {
    const response = await fetch("/api/images?count=" + BATCH, { cache: "no-store" });
    if (!response.ok) throw new Error("proxy " + response.status);
    const data = await response.json();
    return normalize(data.images || []);
  } catch (proxyFailure) {
    const page = 1 + Math.floor(Math.random() * 85);
    const response = await fetch("https://picsum.photos/v2/list?page=" + page + "&limit=" + BATCH);
    if (!response.ok) throw new Error("picsum " + response.status);
    return normalize(await response.json());
  }
}

async function fetchPhoto(id) {
  try {
    const response = await fetch("/api/photo?id=" + encodeURIComponent(id), { cache: "no-store" });
    if (!response.ok) return null;
    const data = await response.json();
    return {
      id: data.id,
      author: data.author,
      width: data.width,
      height: data.height,
      link: data.link,
    };
  } catch (error) {
    return null;
  }
}

function current() {
  return state.pool[state.index] || null;
}

function preload(pic) {
  if (!pic) return;
  const img = new Image();
  img.src = imageUrl(pic, 600, 375);
}

function showError(message) {
  errorBox.textContent = message;
  errorBox.classList.add("show");
  clearTimeout(showError.timer);
  showError.timer = setTimeout(function () { errorBox.classList.remove("show"); }, 4200);
}

let toastTimer = null;
function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 3200);
}

function syncUrl(pic) {
  try {
    history.replaceState(null, "", "/?id=" + encodeURIComponent(pic.id));
  } catch (error) {}
}

function render() {
  const pic = current();
  if (!pic) return;

  loader.classList.add("show");
  photo.classList.remove("ready");

  photo.src = mainImageUrl(pic);
  bg.src = imageUrl(pic, 320, 200);

  credit.textContent = pic.author ? "© " + pic.author : "未知作者";
  credit.href = pic.link || "#";
  dims.textContent = pic.width && pic.height ? "  ·  " + pic.width + "×" + pic.height : "";
  counter.textContent = (state.index + 1) + " / " + state.pool.length;
  poolSize.textContent = String(state.pool.length);

  preload(state.pool[state.index + 1]);
  preload(state.pool[state.index - 1]);

  syncUrl(pic);
  if (state.lightbox) renderLightbox();
}

function applyTransform() {
  lightboxImg.style.transform =
    "translate(" + zoom.tx.toFixed(1) + "px," + zoom.ty.toFixed(1) + "px) scale(" + zoom.scale.toFixed(3) + ")";
  lbZoom.textContent = Math.round(zoom.scale * 100) + "%";
}

function resetZoom() {
  zoom.scale = 1;
  zoom.tx = 0;
  zoom.ty = 0;
  applyTransform();
}

function measureStage() {
  const style = getComputedStyle(stage);
  measure.availW = Math.max(1, stage.clientWidth -
    parseFloat(style.paddingLeft || 0) - parseFloat(style.paddingRight || 0));
  measure.availH = Math.max(1, stage.clientHeight -
    parseFloat(style.paddingTop || 0) - parseFloat(style.paddingBottom || 0));
  measure.baseW = lightboxImg.offsetWidth || 1;
  measure.baseH = lightboxImg.offsetHeight || 1;
}

function clampPan() {
  const maxX = Math.max(0, (measure.baseW * zoom.scale - measure.availW) / 2);
  const maxY = Math.max(0, (measure.baseH * zoom.scale - measure.availH) / 2);
  zoom.tx = Math.min(maxX, Math.max(-maxX, zoom.tx));
  zoom.ty = Math.min(maxY, Math.max(-maxY, zoom.ty));
}

function stageCenter() {
  const style = getComputedStyle(stage);
  const rect = stage.getBoundingClientRect();
  return {
    x: rect.left + parseFloat(style.paddingLeft || 0) + measure.availW / 2,
    y: rect.top + parseFloat(style.paddingTop || 0) + measure.availH / 2,
  };
}

function zoomAt(clientX, clientY, nextScale) {
  const target = Math.min(MAX_ZOOM, Math.max(1, nextScale));
  const center = stageCenter();
  const fx = clientX - center.x;
  const fy = clientY - center.y;
  const ratio = target / zoom.scale;
  zoom.tx = fx - (fx - zoom.tx) * ratio;
  zoom.ty = fy - (fy - zoom.ty) * ratio;
  zoom.scale = target;
  clampPan();
  applyTransform();
}

function renderLightbox() {
  const pic = current();
  if (!pic) return;
  resetZoom();
  lightboxImg.src = lightboxImageUrl(pic);
  lbMeta.textContent = "© " + (pic.author || "未知") +
    (pic.width && pic.height ? "  ·  " + pic.width + "×" + pic.height : "") +
    "  ·  #" + pic.id;
}

lightboxImg.addEventListener("load", function () {
  if (!state.lightbox) return;
  measureStage();
  resetZoom();
});

function openLightbox() {
  if (!current()) return;
  state.lightbox = true;
  lightbox.hidden = false;
  measureStage();
  renderLightbox();
  requestAnimationFrame(function () {
    measureStage();
    resetZoom();
  });
}

function closeLightbox() {
  state.lightbox = false;
  lightbox.hidden = true;
  resetZoom();
}

photo.addEventListener("load", function () {
  state.failures = 0;
  loader.classList.remove("show");
  photo.classList.add("ready");
});

photo.addEventListener("error", function () {
  loader.classList.remove("show");
  state.failures += 1;
  if (state.failures > 3) {
    showError("图片加载失败，点下一张继续。");
    return;
  }
  showError("这张没加载出来，自动换下一张。");
  next();
});

function lock() {
  if (state.busy) return false;
  state.busy = true;
  [prevBtn, nextBtn].forEach(function (btn) {
    if (btn) btn.disabled = true;
  });
  return true;
}

function unlock() {
  state.busy = false;
  [prevBtn, nextBtn].forEach(function (btn) {
    if (btn) btn.disabled = false;
  });
}

async function go(direction) {
  if (!lock()) return;
  try {
    if (direction > 0 && state.index + 1 >= state.pool.length) {
      const batch = await fetchBatch();
      state.pool = state.pool.concat(batch);
    }
    if (direction < 0 && state.index - 1 < 0) {
      const batch = await fetchBatch();
      state.pool = batch.concat(state.pool);
      state.index = batch.length - 1;
      render();
      return;
    }
    const target = state.index + direction;
    if (target >= 0 && target < state.pool.length) {
      state.index = target;
      render();
    }
  } catch (error) {
    showError("获取图片失败：" + (error && error.message ? error.message : error));
  } finally {
    unlock();
  }
}

function next() { return go(1); }
function prev() { return go(-1); }

function downloadCurrent() {
  const pic = current();
  if (!pic) return;
  const name = "picsum-" + pic.id + ".jpg";
  const link = document.createElement("a");
  link.href = "/api/download?id=" + encodeURIComponent(pic.id);
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  toast("开始下载 · " + name);
}

async function shareCurrent() {
  const pic = current();
  if (!pic) return;
  const url = location.origin + "/?id=" + encodeURIComponent(pic.id);

  if (navigator.share) {
    try {
      await navigator.share({
        title: "随机图 · Picsum #" + pic.id,
        text: pic.author ? "来自 Picsum 的随机图片，摄影 " + pic.author : "来自 Picsum 的随机图片",
        url: url,
      });
      return;
    } catch (error) {
      if (error && error.name === "AbortError") return;
    }
  }

  try {
    await navigator.clipboard.writeText(url);
    toast("图片链接已复制");
  } catch (error) {
    toast("复制失败，请手动复制：" + url);
  }
}

const pointers = new Map();
let pan = null;
let pinch = null;
let moved = 0;

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function relative(clientX, clientY) {
  const center = stageCenter();
  return { x: clientX - center.x, y: clientY - center.y };
}

stage.addEventListener("pointerdown", function (event) {
  if (event.pointerType === "mouse" && event.button !== 0) return;
  try { stage.setPointerCapture(event.pointerId); } catch (error) {}
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  moved = 0;

  if (pointers.size === 1) {
    pan = { x: event.clientX, y: event.clientY, tx: zoom.tx, ty: zoom.ty };
    pinch = null;
    stage.classList.add("dragging");
  } else if (pointers.size === 2) {
    const points = Array.from(pointers.values());
    const focus = relative((points[0].x + points[1].x) / 2, (points[0].y + points[1].y) / 2);
    pinch = {
      dist: Math.max(1, distance(points[0], points[1])),
      fx: focus.x,
      fy: focus.y,
      scale: zoom.scale,
      tx: zoom.tx,
      ty: zoom.ty,
    };
    pan = null;
  }
});

stage.addEventListener("pointermove", function (event) {
  if (!pointers.has(event.pointerId)) return;
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

  if (pan && pointers.size === 1) {
    const dx = event.clientX - pan.x;
    const dy = event.clientY - pan.y;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    zoom.tx = pan.tx + dx;
    zoom.ty = pan.ty + dy;
    clampPan();
    applyTransform();
    return;
  }

  if (pinch && pointers.size === 2) {
    const points = Array.from(pointers.values());
    const next = Math.min(MAX_ZOOM, Math.max(1, pinch.scale * (distance(points[0], points[1]) / pinch.dist)));
    const focus = relative((points[0].x + points[1].x) / 2, (points[0].y + points[1].y) / 2);
    const ratio = next / pinch.scale;
    zoom.tx = focus.x - (pinch.fx - pinch.tx) * ratio;
    zoom.ty = focus.y - (pinch.fy - pinch.ty) * ratio;
    zoom.scale = next;
    moved = 999;
    clampPan();
    applyTransform();
  }
});

function release(event) {
  if (!pointers.has(event.pointerId)) return;
  pointers.delete(event.pointerId);

  if (pointers.size === 0) {
    pan = null;
    pinch = null;
    stage.classList.remove("dragging");
    if (zoom.scale < 1.05) {
      resetZoom();
    }
  } else if (pointers.size === 1) {
    pinch = null;
    const point = Array.from(pointers.values())[0];
    pan = { x: point.x, y: point.y, tx: zoom.tx, ty: zoom.ty };
    stage.classList.add("dragging");
  }
}

stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("pointerleave", function (event) {
  if (event.pointerType === "mouse" && pointers.size === 0) {
    stage.classList.remove("dragging");
  }
});

stage.addEventListener("wheel", function (event) {
  event.preventDefault();
  const next = zoom.scale * Math.exp(-event.deltaY * 0.0016);
  zoomAt(event.clientX, event.clientY, next);
}, { passive: false });

stage.addEventListener("dblclick", function (event) {
  event.preventDefault();
  zoomAt(event.clientX, event.clientY, zoom.scale > 1.05 ? 1 : 2.5);
});

stage.addEventListener("click", function (event) {
  if (event.target === stage && moved < 6 && zoom.scale <= 1.05) {
    closeLightbox();
  }
});

prevBtn.addEventListener("click", prev);
nextBtn.addEventListener("click", next);
photo.addEventListener("click", openLightbox);
document.getElementById("download").addEventListener("click", downloadCurrent);
document.getElementById("share").addEventListener("click", shareCurrent);
document.getElementById("lbDownload").addEventListener("click", downloadCurrent);
document.getElementById("lbShare").addEventListener("click", shareCurrent);
document.getElementById("lbClose").addEventListener("click", closeLightbox);

document.addEventListener("keydown", function (event) {
  if (event.target && /^(INPUT|TEXTAREA)$/.test(event.target.tagName)) return;
  if (event.key === "Escape" && state.lightbox) { closeLightbox(); return; }
  if (event.key === "ArrowRight") { event.preventDefault(); next(); }
  if (event.key === "ArrowLeft") { event.preventDefault(); prev(); }
});

const themeBtn = document.getElementById("theme");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeBtn.textContent = theme === "dark" ? "浅色" : "深色";
  try { localStorage.setItem("random-images-theme", theme); } catch (error) {}
}
let storedTheme = null;
try { storedTheme = localStorage.getItem("random-images-theme"); } catch (error) {}
applyTheme(storedTheme || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
themeBtn.addEventListener("click", function () {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

let resizeTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    const pic = current();
    if (!pic) return;
    if (state.lightbox) {
      measureStage();
      clampPan();
      applyTransform();
    } else {
      photo.src = mainImageUrl(pic);
    }
  }, 320);
});

(async function start() {
  if (!lock()) return;
  try {
    state.pool = await fetchBatch();
    const wanted = new URLSearchParams(location.search).get("id");
    if (wanted && /^\d+$/.test(wanted)) {
      const at = state.pool.findIndex(function (pic) { return pic.id === wanted; });
      if (at >= 0) {
        state.index = at;
      } else {
        const single = await fetchPhoto(wanted);
        if (single) {
          state.pool.unshift(single);
          state.index = 0;
        } else {
          state.index = Math.floor(Math.random() * state.pool.length);
        }
      }
    } else {
      state.index = Math.floor(Math.random() * state.pool.length);
    }
    render();
  } catch (error) {
    showError("初始化失败：" + (error && error.message ? error.message : error));
  } finally {
    unlock();
  }
})();
</script>
